version: 2

# One monthly PR for all ecosystems (root npm, frontend npm, GitHub Actions).
multi-ecosystem-groups:
  all:
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"

updates:
  - package-ecosystem: "npm"
    directory: "/"
    multi-ecosystem-group: "all"
    patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    multi-ecosystem-group: "all"
    patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    multi-ecosystem-group: "all"
    patterns: ["*"]
